name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, Spotless, JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests unitaires + tests d'intégration sur PostgreSQL (Testcontainers, Docker du runner).
      - run: ./mvnw -B verify
      # Le contrat OpenAPI versionné (source du client TypeScript) doit suivre l'API.
      - name: Contrat OpenAPI à jour
        run: git diff --exit-code ../frontend/openapi.json
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Front (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Le client TypeScript est généré depuis openapi.json, jamais écrit à la main.
      - name: Client API généré à jour
        run: npm run api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Parcours de vente (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POS_DB_PASSWORD: pos
      POS_ADMIN_INITIAL_PASSWORD: Installation-CI-2026
      # Secret jetable, propre à ce job : la base est détruite à la fin.
      POS_JWT_SECRET: secret-e2e-ci-uniquement-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du front, servi par Spring Boot
        working-directory: frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../backend/src/main/resources/static
          cp -r dist/. ../backend/src/main/resources/static/
      - name: Démarrage de l'application
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests -Dspotless.check.skip=true -Djacoco.skip=true
          nohup java -jar target/invento-pos.jar --spring.profiles.active=dev > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && exit 0; sleep 2; done
          cat app.log; exit 1
      - name: Navigateur
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Tests Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/playwright-report
            backend/app.log
          if-no-files-found: ignore

  image:
    name: Image Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sur une PR : vérifie seulement que l'image se construit (amd64).
      # Sur main : images amd64 (Cloud Run, PC) + arm64 (Raspberry Pi) publiées sur GHCR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Déploiement Cloud Run, actif seulement quand les variables GCP du dépôt sont renseignées
  # (Settings > Secrets and variables > Actions > Variables). Authentification sans clé par
  # Workload Identity Federation ; les secrets applicatifs restent dans Secret Manager.
  deploy:
    name: Déploiement Cloud Run
    needs: image
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: test-en-ligne
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/invento-pos/app:${{ github.sha }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # L'image GHCR est privée : connexion nécessaire pour la récupérer.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cloud Run ne tire pas depuis GHCR : l'image amd64 est recopiée dans Artifact Registry.
      - name: Copie de l'image vers Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker pull --platform linux/amd64 "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: invento-pos
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # Service public (l'application gère ses comptes) ; compte d'exécution dédié qui lit
          # seulement les deux secrets. 2 instances x 5 connexions restent sous la limite du
          # pooler Supabase ; le démarrage de Spring Boot profite du CPU boost. La sonde de
          # démarrage attend la readiness Spring (après les ApplicationRunner, dont la création
          # de l'admin) : sinon Cloud Run bride le CPU dès que le port est ouvert.
          flags: >-
            --allow-unauthenticated
            --startup-probe=httpGet.path=/actuator/health/readiness,httpGet.port=8080,periodSeconds=5,timeoutSeconds=3,failureThreshold=24
            --service-account=invento-pos-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --memory=1Gi
            --cpu-boost
            --max-instances=2
          env_vars: |
            POS_DB_URL=${{ vars.POS_DB_URL }}
            POS_DB_USER=${{ vars.POS_DB_USER }}
            POS_DB_POOL_SIZE=5
          secrets: |
            POS_DB_PASSWORD=pos-db-password:latest
            POS_JWT_SECRET=pos-jwt-secret:latest
