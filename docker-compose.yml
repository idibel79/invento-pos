# Installation sur le site (Raspberry Pi ou PC) : l'application et sa base PostgreSQL.
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up -d
# En développement, seule la base est utile : docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD:-pos}
    volumes:
      - pos-db:/var/lib/postgresql/data
    ports:
      # Exposée en local uniquement (développement, sauvegardes pg_dump).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${POS_IMAGE:-ghcr.io/idibel79/invento-pos:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POS_DB_URL: jdbc:postgresql://db:5432/pos
      POS_DB_USER: pos
      POS_DB_PASSWORD: ${POS_DB_PASSWORD:-pos}
      POS_JWT_SECRET: ${POS_JWT_SECRET:?POS_JWT_SECRET doit être défini dans .env}
      POS_ADMIN_INITIAL_PASSWORD: ${POS_ADMIN_INITIAL_PASSWORD:-}
      # Sur le réseau local sans HTTPS, mettre false (sinon le cookie de session est refusé).
      POS_COOKIE_SECURE: ${POS_COOKIE_SECURE:-true}
    ports:
      - "8080:8080"

volumes:
  pos-db:
